[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenRecall"
version = "0.8"
description = "Privacy-first screen recall tool, open-source alternative to Windows Recall"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0"}
authors = [
    {name = "OpenRecall contributors"}
]
keywords = ["screen-capture", "search", "ai", "privacy", "recall"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "Flask==3.0.3",
    "numpy>=1.26.4",
    "mss==9.0.1",
    "sentence-transformers>=3.0.0",
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "shapely>=2.0.4",
    "h5py>=3.11.0",
    "rapidfuzz>=3.9.3",
    "Pillow>=10.3.0",
]

[project.optional-dependencies]
windows = ["pywin32", "psutil"]
macos = ["pyobjc==10.3"]
linux = []
python-doctr = [
    "python-doctr @ git+https://github.com/koenvaneijk/doctr.git@af711bc04eb8876a7189923fb51ec44481ee18cd"
]
dev = ["pytest", "pytest-mock"]

[project.urls]
Homepage = "https://github.com/openrecall/openrecall"
Repository = "https://github.com/openrecall/openrecall.git"
Documentation = "https://github.com/openrecall/openrecall/wiki"
Discussions = "https://github.com/openrecall/openrecall/discussions"
Discord = "https://discord.gg/RzvCYRgUkx"

[tool.setuptools]
packages = ["openrecall"]

[tool.setuptools.package-data]
openrecall = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
