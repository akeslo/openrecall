{% extends "base.html" %}
{% block content %}
{% if entries|length > 0 %}
  <div class="container">
    <div class="slider-container">
      <input type="range" class="slider custom-range" id="discreteSlider" min="0" max="{{entries|length - 1}}" step="1" value="{{entries|length - 1}}">
      <div class="slider-value" id="sliderValue"></div>
    </div>
    <div class="image-container">
      <img id="timestampImage" src="/static/{{entries[0][1]}}_0.webp" alt="Image for timestamp">
      <div>
        <button type="button" class="btn btn-sm btn-danger mt-2" id="deleteCurrentEntry">Delete</button>
      </div>
    </div>
  </div>
  <script>
    // entries are [id, timestamp] pairs, newest first (same ordering the
    // server queries in). The slider stays oldest-to-newest left-to-right,
    // so index lookups are reversed exactly as they were when this only
    // carried timestamps.
    let entries = {{ entries|tojson }};
    const slider = document.getElementById('discreteSlider');
    const sliderValue = document.getElementById('sliderValue');
    const timestampImage = document.getElementById('timestampImage');
    const deleteButton = document.getElementById('deleteCurrentEntry');

    function currentEntry() {
      const reversedIndex = entries.length - 1 - slider.value;
      return entries[reversedIndex];
    }

    function renderCurrent() {
      const [, timestamp] = currentEntry();
      sliderValue.textContent = new Date(timestamp * 1000).toLocaleString();
      timestampImage.src = `/static/${timestamp}_0.webp`;
    }

    slider.addEventListener('input', renderCurrent);

    deleteButton.addEventListener('click', function() {
      if (entries.length === 0) {
        return;
      }
      const [entryId] = currentEntry();
      if (!confirm("Delete this capture? This cannot be undone.")) {
        return;
      }
      fetch(`/entry/${entryId}`, { method: "DELETE" })
        .then((response) => {
          if (!response.ok) {
            throw new Error("Delete failed");
          }
          entries = entries.filter(([id]) => id !== entryId);
          if (entries.length === 0) {
            location.reload();
            return;
          }
          slider.max = entries.length - 1;
          if (slider.value > slider.max) {
            slider.value = slider.max;
          }
          renderCurrent();
        })
        .catch(() => {
          alert("Failed to delete this capture.");
        });
    });

    // Initialize the slider with a default value
    slider.value = entries.length - 1;
    renderCurrent();
  </script>
{% else %}
  <div class="container">
      <div class="alert alert-info" role="alert">
          Nothing recorded yet, wait a few seconds.
      </div>
  </div>
{% endif %}
{% endblock %}
